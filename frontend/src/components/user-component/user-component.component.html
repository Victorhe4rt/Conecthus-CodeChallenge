<mat-toolbar color="primary">
  <span class="user-title">Usuários</span>


</mat-toolbar>

<!-- Table component -->

<div class="table-container">
  
  <div class="form-container">
    <mat-form-field appearance="fill" class="search-field small-input">
      <mat-label>Pesquisar Usuários</mat-label>
      <input matInput [(ngModel)]="searchText" placeholder="Digite para pesquisar">
      <button mat-icon-button matPrefix>
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>
    
    <span class="add-password">
      <button mat-raised-button (click)="addNewPassword()">
        <mat-icon>add</mat-icon>
        Cadastrar Usuário
      </button>
    </span>

  </div>

  <table mat-table class="mat-elevation-z8" [dataSource]="filteredUsers">
    <ng-container matColumnDef="nome">
      <th mat-header-cell *matHeaderCellDef> Nome </th>
      <td mat-cell *matCellDef="let user"> {{user.nome}} </td>
    </ng-container>



    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>   <span class="actions-header">Ações</span></th>
      <td mat-cell *matCellDef="let user">

        <button mat-icon-button color="accent" (click)="openViewDialog(user)">
          <mat-icon>visibility</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="deleteCard(user)">
          <mat-icon>delete</mat-icon>
        </button>

        <button mat-icon-button color="primary" (click)="openEditDialog(user)">
          <mat-icon>edit</mat-icon>
        </button>   
      
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let user; columns: displayedColumns;"></tr>
  </table>
</div>


<!-- Table component -->
